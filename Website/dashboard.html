<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard — Breaking the Session</title>
</head>

<body>

    <h1>Protected Dashboard</h1>

    <h2>Welcome, {{ username }}!</h2>

    <p>
        You successfully authenticated.
    </p>

    <p>
        Current Security Mode: {{ mode }}
    </p>

    <p>
        This page is accessible only when the server
        recognizes an authenticated session.
    </p>

    <form method="POST" action="/logout">
        <button type="submit">Logout</button>
    </form>

</body>

</html>
